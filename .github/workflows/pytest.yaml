name: pytest

on:
  push:
    branches:
     - main
    tags-ignore:
      - '**'
  pull_request:

jobs:
  pytest:
    name: "Python ${{ matrix.py }} on OS ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    env:
      COVERAGE_SINGLE: 78
      COVERAGE_TOTAL: 78

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        py: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: "actions/checkout@v4"

      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.py }}

      - name: Setup MinGW (Windows only)
        if: ${{ runner.os == 'Windows' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
          path-type: inherit

      

      - name: Install old versions of supported dependencies
        if: ${{ matrix.py == '3.9'}}
        run: pip install numpy==2.0 scipy==1.13.0

      - name: Install development version (non-Windows)
        if: ${{ runner.os != 'Windows' }}
        run: |
          pip install numpy>=2.0 setuptools_scm scikit-build-core cmake ninja
          pip install --no-build-isolation -v -e .[dev,iodata]

      - name: Install development version (Windows MinGW)
        if: ${{ runner.os == 'Windows' }}
        env:
          CMAKE_GENERATOR: "MinGW Makefiles"
          CC: gcc
          CXX: g++
        shell: msys2 {0}
        run: |
          pip install numpy>=2.0 setuptools_scm scikit-build-core cmake ninja
          pip install --no-build-isolation -v -e .[dev,iodata]

      - name: Run Pytest (non-Windows)
        if: ${{ runner.os != 'Windows' }}
        run: |
          pytest tests/ -x --timeout=300

      - name: Run Pytest (Windows MinGW)
        if: ${{ runner.os == 'Windows' }}
        shell: msys2 {0}
        env:
          PATH: /mingw64/bin:$PATH
        run: |
          export PATH="/mingw64/bin:$PATH"
          pytest tests/ -x --timeout=300 