[build-system]
requires = ["numpy>=2.0", "scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "qc-gbasis"
authors = [
  { name="QC-Devs Community", email="qcdevs@gmail.com"},
]
description = "A module for evaluating, differentiating, and integrating Gaussian functions."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)',
    'Operating System :: POSIX :: Linux',
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    'Topic :: Scientific/Engineering :: Physics',
    'Topic :: Scientific/Engineering :: Chemistry',
    "Topic :: Scientific/Engineering :: Mathematics",
    'Intended Audience :: Science/Research',
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11.1",
    "importlib_resources",
    "sympy",
]
dynamic = ["version"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["gbasis"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "tox",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-md",
    "setuptools_scm",
    "sphinx",
    "sphinx_autodoc_typehints",
    "sphinx-copybutton",
]
doc = [
    "numpydoc",
    "sphinx_copybutton",
    "sphinx-autoapi",
    "nbsphinx",
    "sphinx_rtd_theme",
    "sphinx_autodoc_typehints",
    "docutils==0.16",
    "nbsphinx-link"
]
iodata = [
    "qc-iodata>=1.0.0a5"
]
pyscf = [
    "pyscf>=1.6.1"
]

[project.urls]
Documentation = "https://gbasis.qcdevs.org"
Issues = "https://github.com/theochem/gbasis/issues"
Source = "https://github.com/theochem/gbasis/"
Changelog = "https://github.com/theochem/gbasis/blob/main/CHANGELOG.md"
Organization = "https://github.com/theochem/"

[tool.black]
line-length = 100

[tool.ruff]
select = ["E", "F", "UP", "B", "I", "PGH", "PL", "RUF"]
line-length = 100
ignore = ["PLR2004", "PLR0913", "PLR0912", "PLW2901", "PLR0915", "RUF013"]
extend-exclude = ["doc/*", "doc/*/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v"
